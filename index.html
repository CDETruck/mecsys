<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#182c4d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>CDE Truck & Car Repair — Tablero</title>
<style>
:root{--navy:#182c4d;--org:#e8720c;--bg:#eef1f5;--card:#fff;--line:#d8dee8;
--txt:#1c2430;--mut:#6b7686;--ok:#1e8e4e;--warn:#c98a00;--bad:#c93b3b;--blue:#2563a8}
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--txt);padding-bottom:calc(82px + env(safe-area-inset-bottom));-webkit-tap-highlight-color:transparent}
button,label{touch-action:manipulation}
header{background:var(--navy);color:#fff;padding:12px 14px 6px;position:sticky;top:0;z-index:20;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.hwrap{display:flex;justify-content:space-between;align-items:center;gap:8px;max-width:960px;margin:0 auto}
.brand{display:flex;gap:10px;align-items:center;min-width:0}
.logo{background:var(--org);font-weight:800;padding:7px 9px;border-radius:8px;letter-spacing:1px;flex:none}
.logoimg{height:42px;max-width:140px;object-fit:contain;background:#fff;border-radius:9px;padding:4px 7px;flex:none}
.brand b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;opacity:.75;font-size:11px;text-transform:capitalize}
.hbtns{display:flex;gap:6px;flex:none;flex-wrap:wrap;justify-content:flex-end}
.hbtns button,.hbtns label{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:8px;padding:7px 9px;font-size:12px;cursor:pointer;transition:.15s}
.hbtns button:hover,.hbtns label:hover{background:rgba(255,255,255,.25)}
.hbtns button:active{transform:scale(.95)}
.stats{display:flex;gap:8px;max-width:960px;margin:10px auto 0}
.stat{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:10px;padding:5px 8px;font-size:11px;flex:1;text-align:center}
.stat b{display:block;font-size:18px}
.who{display:flex;gap:6px;overflow-x:auto;max-width:960px;margin:8px auto 4px;padding-bottom:2px}
.wchip{flex:none;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:999px;padding:8px 14px;font-size:14px;font-weight:700;cursor:pointer;transition:.15s}
.wchip.on{background:#fff;color:var(--navy)}
main{max-width:960px;margin:0 auto;padding:12px}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:20;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:none;padding:9px 2px 11px;font-size:20px;color:var(--mut);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;transition:.15s}
nav button span{font-size:11px;font-weight:700}
nav button.on{color:var(--org);border-top:3px solid var(--org)}
.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.toolbar input[type=search]{flex:1;min-width:150px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;font-size:15px}
.btn{border:none;border-radius:10px;padding:12px 16px;font-size:15px;font-weight:700;cursor:pointer;transition:.15s}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--org);color:#fff}
.btn.sec{background:#fff;border:1px solid var(--line);color:var(--txt)}
.btn.sec:hover{background:#f4f6fa}
.btn.ok{background:var(--ok);color:#fff}
.btn.bad{background:var(--bad);color:#fff}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:8px}
.btn.big{width:100%;padding:17px;font-size:18px;border-radius:13px}
.btn.neword{width:100%;background:var(--navy);color:#fff;font-size:18px;padding:16px;border-radius:13px;margin-bottom:14px}
input,select,textarea{width:100%;padding:13px;border:1px solid var(--line);border-radius:10px;font-size:16px;background:#fff;color:var(--txt)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,168,.15)}
textarea{min-height:80px;resize:vertical}
label.f{display:block;font-size:13px;font-weight:800;color:var(--mut);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.3px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:11px}
.card.urg{border:2px solid var(--bad)}
.badge{display:inline-block;padding:4px 11px;border-radius:999px;font-size:12px;font-weight:800}
.bFila{background:#e8ecf3;color:#4a5568}.bSig{background:var(--org);color:#fff}
.bProg{background:#e3f0fb;color:#1d5c9e}.bDone{background:#e5f5ea;color:#1e7a45}.bUrg{background:#fdeaea;color:var(--bad)}
.jtop{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ot{font-size:13px;color:var(--mut)}
.jacts{margin-left:auto;display:flex;gap:5px}
.junit{font-size:21px;font-weight:800;margin:7px 0 2px}
.jdesc{color:var(--mut);font-size:14px;margin:4px 0;white-space:pre-wrap}
.jtot{margin-top:9px;padding-top:9px;border-top:1px dashed var(--line);font-size:14px}
.jtot b{color:var(--org)}
.chip{display:inline-flex;align-items:center;gap:5px;background:#f1f4f9;border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:13px;margin:3px 3px 0 0;cursor:pointer;user-select:none;transition:.15s}
.chip.sel{background:var(--org);border-color:var(--org);color:#fff;font-weight:700}
.chip.read{cursor:default;background:#f6f7fa}
.loc{display:inline-block;color:#fff;font-weight:800;border-radius:6px;padding:3px 8px;font-size:12px;flex:none}
.qty{display:inline-block;border-radius:6px;padding:2px 8px;font-weight:800;font-size:13px;background:#e5f5ea;color:#1e7a45}
.qty.low{background:#fdeaea;color:var(--bad)}
.pickrow{display:flex;align-items:center;gap:9px;padding:10px 11px;background:#fff;border:1px solid var(--line);border-radius:11px;margin-bottom:7px;flex-wrap:wrap}
.pinfo{flex:1;min-width:130px}
.pinfo b{font-size:15px}
.pinfo small{display:block;color:var(--mut);font-size:12px}
.stepbox{display:flex;gap:5px;align-items:center}
.stepbox button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:#f6f7fa;font-size:19px;font-weight:800;cursor:pointer}
.stepbox button:active{transform:scale(.93)}
.stepbox b{min-width:30px;text-align:center;font-size:17px}
.subhead{font-size:13px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;margin:18px 0 8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cartbox{background:#fff8ef;border:1px solid #f0d8b6;border-radius:14px;padding:13px;margin-bottom:12px}
.cartbox h3{font-size:14px;color:#8a5200;margin-bottom:7px}
.mrow{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px dashed #eedbbc;font-size:14px;flex-wrap:wrap}
.mrow:last-child{border:none}
.step{margin:20px 0 4px;font-weight:800;font-size:16px;color:var(--navy);border-bottom:2px solid var(--line);padding-bottom:5px}
.chipbox{max-height:230px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:8px;background:#fafbfd}
.selrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;font-size:14px;border-bottom:1px dashed var(--line)}
.selrow input{width:100px;padding:8px;text-align:right}
.mut{color:var(--mut);font-size:13px}
.warnmut{color:var(--bad);font-size:12px;font-weight:700}
.hist{font-size:13px;padding:8px 0;border-bottom:1px dashed var(--line)}
.empty{text-align:center;color:var(--mut);padding:30px 10px;font-size:15px}
.helpbox{background:#eef4fb;border:1px solid #cfdff2;border-radius:14px;padding:14px;margin-bottom:14px;font-size:14px;line-height:1.7}
#overlay{position:fixed;inset:0;background:rgba(15,23,40,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
#overlay[hidden]{display:none !important}
#modal{background:#fff;width:100%;max-width:580px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px}
@media(min-width:700px){#overlay{align-items:center}#modal{border-radius:16px}}
.mhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.mhead h3{font-size:19px}
.x{background:none;border:none;font-size:24px;cursor:pointer;color:var(--mut)}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--navy);color:#fff;padding:13px 22px;border-radius:999px;font-weight:700;z-index:99;opacity:0;transition:.25s;pointer-events:none;max-width:90%;text-align:center}
#toast.show{opacity:1}
.priceedit{cursor:pointer;padding:2px 6px;border-radius:6px;border:1px solid transparent}
.priceedit:hover{background:#fff8ef;border-color:#f0d8b6}
.reqbadge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:800;margin-left:4px}
.reqneeded{background:#fdeaea;color:var(--bad)}.reqapproved{background:#fff3e0;color:#a55400}
.reqordered{background:#e3f0fb;color:#1d5c9e}.reqreceived{background:#e5f5ea;color:#1e7a45}
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <div class="brand" id="brand"></div>

</nav>
<div id="overlay" hidden onclick="if(event.target===this)cerrar()"><div id="modal"></div></div>
<div id="toast"></div>

function loadDB(){
 try{
  const v2=JSON.parse(localStorage.getItem('cde_v2'));
  if(v2&&v2.parts&&v2.jobs){
   if(!v2.vendorParts){const s=seed();v2.vendorParts=s.vendorParts}
   if(!v2.requests)v2.requests=[];
   if(!v2.nextReq)v2.nextReq=1;
   return v2;
  }
  const v1=JSON.parse(localStorage.getItem('cde_v1'));
  if(v1&&v1.parts){const s=seed();
   return{nextJob:v1.nextJob||1,nextReq:1,currentUser:'mgr',lang:'es',outLang:'en',logo:'',mechanics:v1.mechanics,services:v1.services,parts:v1.parts,
    jobs:(v1.jobs||[]).map(j=>({num:j.num,ts:j.ts,st:j.st==='Pendiente'?'En fila':j.st,urgent:false,unit:j.unit,client:j.client||'',
      desc:j.desc||'',serv:j.serv||[],prices:j.prices||{},leader:null,mech:j.mech||[],parts:[],finished:null})),
    moves:v1.moves||[],requests:[],vendorParts:s.vendorParts};}
 }catch(e){}
 return seed();
}

function setLogoFile(ev){
 const f=ev.target.files[0];if(!f)return;
 if(!f.type.startsWith('image/')){alert('⚠ PNG / JPG.');return}
 const r=new FileReader();
 r.onload=()=>{const img=new Image();
  img.onload=()=>{const sc=Math.min(360/img.width,120/img.height,1);
   const w=Math.max(1,Math.round(img.width*sc)),h=Math.max(1,Math.round(img.height*sc));
   const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
   db.logo=c.toDataURL('image/png');save();cerrar();toast(t('t_logo'));};
  img.onerror=()=>alert('⚠');img.src=r.result;};
 r.readAsDataURL(f);ev.target.value='';
}

function cambiarSt(n,st){const j=db.jobs.find(x=>x.num===n);if(j){j.st=st;if(st==='Terminado')j.finished=Date.now();save();render()}}

function tomar(num){
 const j=db.jobs.find(x=>x.num===num);if(!j)return;
 const fila=db.jobs.filter(x=>x.st==='En fila').sort((a,b)=>a.ts-b.ts);
 if(fila[0]&&fila[0].num!==num&&!confirm(t('skip_confirm')+' ('+OT(fila[0].num)+'). '+t('take_anyway')))return;
 const uid=userId();
 if(uid){j.leader=uid;if(!(j.mech||[]).includes(uid))j.mech.push(uid);j.st='En progreso';save();render();toast('🙋 '+mechName(uid)+' '+t('t_took')+' '+OT(num))}
 else abrir(mhead(t('who_t'))+db.mechanics.map(m=>
   `<button class="btn pri big" style="margin-bottom:8px" onclick="asignaToma(${num},${m.id})">🙋 ${esc(m.name)}</button>`).join('')+
   `<button class="btn sec big" onclick="cerrar()">${t('cancel_b')}</button>`);
}

 j.leader=mid;if(!(j.mech||[]).includes(mid))j.mech.push(mid);j.st='En progreso';save();render();toast('🙋 '+mechName(mid)+' '+t('t_took')+' '+OT(num))}

 const j=db.jobs.find(x=>x.num===num);
 abrir(mhead(t('equipo_t')+' '+OT(num))+
  db.mechanics.map(m=>{const inT=(j.mech||[]).includes(m.id);
   return `<div class="pickrow"><b style="flex:1">${inT?'✅':'⬜'} ${esc(m.name)} ${j.leader===m.id?'⭐':''}</b>

function sacarLista(num,i){
 const j=db.jobs.find(x=>x.num===num),lid=j.leader||userId();
 if(!lid){abrir(mhead(t('who_take'))+db.mechanics.map(m=>
  `<button class="btn pri big" style="margin-bottom:8px" onclick="cerrar();sacaComo(${num},${i},${m.id})">🛒 ${esc(m.name)}</button>`).join('')+
  `<button class="btn sec big" onclick="cerrar()">${t('cancel_b')}</button>`);return}
 sacaComo(num,i,lid);
}
function sacaComo(num,i,mid){
 const j=db.jobs.find(x=>x.num===num),p=j.parts[i],part=partBySku(p.sku);
 if(!part||p.picked)return;
 const precio=p.priceOverride!=null?p.priceOverride:part.precio;
 if(part.cant>=p.q){
  part.cant-=p.q;p.picked=true;p.priceOverride=precio;
  db.moves.push({id:Date.now()+Math.random(),ts:Date.now(),sku:p.sku,es:part.es,en:part.en,q:p.q,mech:mid,job:num,precio:precio,loc:part.loc,dest:'cart',destTxt:'',open:true,end:null});
  toast('📦 '+p.q+'× '+L(part)+' '+t('t_to_cart')+' '+mechName(mid));
 }else if(part.cant>0){
  if(confirm('⚠ '+t('only')+' '+part.cant+' ('+part.loc+'). '+t('t_short_f')+' '+(p.q-part.cant)+'?')){
   const take=part.cant;part.cant=0;p.picked=true;p.falta=p.q-take;p.priceOverride=precio;
   db.moves.push({id:Date.now()+Math.random(),ts:Date.now(),sku:p.sku,es:part.es,en:part.en,q:take,mech:mid,job:num,precio:precio,loc:part.loc,dest:'cart',destTxt:'',open:true,end:null});
   toast(t('t_short_f')+' '+(p.q-take)+' '+t('t_avisa'));
  }else return;
 }else{p.falta=p.q;toast(t('t_no_stock'))}
 save();render();
}

function cardReq(r){
 const vp=db.vendorParts.find(v=>v.sku===r.sku);
 const precio=vp?vp.precio:r.precio||0;
 const total=precio*r.q;
 const statusBadge={needed:t('vp_needed'),approved:t('vp_approved'),ordered:t('vp_ordered'),received:t('vp_received'),cancelled:'CANCELLED'}[r.status];
 const badgeClass={needed:'reqneeded',approved:'reqapproved',ordered:'reqordered',received:'reqreceived'}[r.status];
 const isMgr=db.currentUser==='mgr';
 let actions='';
 if(r.status==='needed'&&isMgr)actions=`<button class="btn sm ok" onclick="reqApprove(${r.id})">${t('vp_mgr_approve')}</button><button class="btn sm bad" onclick="reqCancel(${r.id})">${t('vp_cancel')}</button>`;
 else if(r.status==='approved'&&isMgr)actions=`<button class="btn sm pri" onclick="reqMarkSent(${r.id})">${t('vp_mgr_send')}</button>`;
 else if(r.status==='ordered'&&isMgr)actions=`<button class="btn sm ok" onclick="reqMarkReceived(${r.id})">${t('vp_mgr_receive')}</button>`;
 else if(r.status==='needed')actions=`<button class="btn sm bad" onclick="reqCancel(${r.id})">${t('vp_cancel')}</button>`;
 
 return `<div class="card">

  <div class="mut">${esc(r.sku)} · ${r.cat||'Warehouse'} · ${r.q} ${t('qtyshort')} × ${money(precio)} = <b>${money(total)}</b></div>
  ${r.urg!=='normal'?`<span class="badge ${r.urg==='critical'?'bUrg':'bSig'}" style="font-size:10px">${r.urg.toUpperCase()}</span>`:''}

function reqMarkSent(id){
 const r=db.requests.find(x=>x.id===id);if(!r)return;

 if(!r.eta)r.eta=prompt(t('vp_eta'),'')||'';
 save();render();toast(t('vp_sent_toast'));
}
function reqMarkReceived(id){
 const r=db.requests.find(x=>x.id===id);if(!r)return;
 r.status='received';r.receivedDate=new Date().toISOString();
 // agregar a warehouse si no existe
 if(!db.parts.some(p=>p.sku===r.sku)){
  const v=db.vendorParts.find(x=>x.sku===r.sku);
  const loc=prompt((lang()==='en'?'Rack location: ':'Rack / ubicación: '),'E1');
  if(loc)db.parts.push({sku:r.sku,es:r.es,en:r.en||r.es,loc:loc.toUpperCase(),precio:v?.precio||0,cant:r.q,min:Math.max(1,Math.floor(r.q/2))});
  else{toast('⚠');return}
 }else{
  const p=db.parts.find(p=>p.sku===r.sku);
  p.cant+=r.q;
  // actualizar precio del vendor si es más reciente
  const v=db.vendorParts.find(x=>x.sku===r.sku);
  if(v)p.precio=v.precio;
 }
 save();render();toast(t('vp_received_toast'));
}

}

const csvEsc=v=>{v=String(v??'');return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
function qbRows(j){
 const rows=[],date=new Date(j.finished||j.ts).toLocaleDateString('en-US'),cust=j.client||'Walk-in';
 (j.serv||[]).forEach(c=>{const s=servByCode(c);if(!s)return;const rate=Number((j.prices||{})[c])||s.precio||0;
  rows.push([date,OT(j.num),cust,j.unit,'Service',s.code,OL(s),1,rate.toFixed(2),rate.toFixed(2)])});
 db.moves.filter(m=>m.job===j.num&&!m.open&&m.end==='use').forEach(m=>{const part=partBySku(m.sku);
  const rate=(m.cargo!=null?m.cargo:m.precio)||0;
  rows.push([date,OT(j.num),cust,j.unit,'Part',m.sku,part?OL(part):m.es,m.q,rate.toFixed(2),(rate*m.q).toFixed(2)])});
 return rows;
}
function exportCSV(nums){
 const jobs=(nums&&nums.length?nums.map(n=>db.jobs.find(j=>j.num===n)):db.jobs.filter(j=>j.st==='Terminado')).filter(Boolean);
 if(!jobs.length){alert('—');return}
 const header=['Date','DocNumber','Customer','Unit','LineType','Code','Description','Qty','Rate','Amount'];
 const rows=jobs.flatMap(qbRows);
 const csv='\uFEFF'+[header,...rows].map(r=>r.map(csvEsc).join(',')).join('\r\n');
 download('cde-quickbooks-'+new Date().toISOString().slice(0,10)+'.csv',csv,'text/csv');
 toast(t('t_csv'));
}

function exportar(){download('cde-respaldo-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(db,null,1),'application/json');toast(t('t_backup'))}
function importar(ev){
 const f=ev.target.files[0];if(!f)return;
 const r=new FileReader();
 r.onload=()=>{try{const d=JSON.parse(r.result);
  if(d.parts&&d.services&&d.mechanics&&d.jobs){
   if(!d.vendorParts)d.vendorParts=seed().vendorParts;
   if(!d.requests)d.requests=[];if(!d.nextReq)d.nextReq=1;
   db=d;save();render();toast(t('t_restored'))}
  else alert('⚠')}catch(e){alert('⚠')}};
 r.readAsText(f);ev.target.value='';
}

 render();window.scrollTo(0,0);
